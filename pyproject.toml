[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canada-java-ats-finder"
version = "1.0.0"
description = "Persistent discovery of newly published or newly observed Java jobs in Ottawa and remote Canada"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<4",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[project.scripts]
ats-finder = "ats_finder.cli:main"
ats-finder-worker = "ats_finder.worker:main"

[tool.setuptools.packages.find]
include = ["ats_finder*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live: bounded tests that call public ATS endpoints (opt in with --run-live)",
]
